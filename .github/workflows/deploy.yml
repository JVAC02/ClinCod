name: Deploy ClinCod to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validar Arquivos e Integridade
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar Arquivos Essenciais
        run: |
          test -f index.html || { echo "Arquivo index.html ausente"; exit 1; }
          test -f apac.html || { echo "Arquivo apac.html ausente"; exit 1; }
          test -f base_dados.js || { echo "Arquivo base_dados.js ausente"; exit 1; }
          test -f pdf-lib.min.js || { echo "Arquivo pdf-lib.min.js ausente"; exit 1; }
          test -f aih_base.pdf || { echo "Arquivo aih_base.pdf ausente"; exit 1; }
          test -f apac_base.pdf || { echo "Arquivo apac_base.pdf ausente"; exit 1; }
          echo "Todos os arquivos de produção estão presentes!"

      - name: Validar Sintaxe JavaScript
        run: |
          node -c base_dados.js
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = [...html.matchAll(/<script(?:\s+[^>]*)?>([\s\S]*?)<\/script>/gi)];
            const mainScript = scripts.find(s => s[1].length > 1000);
            if (!mainScript) throw new Error('Script principal não encontrado em index.html');
            new Function(mainScript[1]);
            console.log('Validação de sintaxe JavaScript concluída com sucesso!');
          "

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Fazer Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
